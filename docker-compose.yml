version: '3.8'

services:
  app:
    build: .
    container_name: pulseflow_app
    ports:
      - "5000:5000"
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/pulseflow
      - JWT_SECRET=pulseflow-recruiter-demo-jwt-secret-key-2026
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pulseflow_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=pulseflow
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pulseflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
